image: ghcr.io/cirruslabs/android-sdk:34

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"

stages:
  - lint
  - test
  - build

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

before_script:
  - chmod +x ./gradlew
  - cp "$GOOGLE_SERVICES_JSON" app/google-services.json

lint-job:
  stage: lint
  script:
    - ./gradlew lintDebug
  only:
    - main
    - develop
    - merge_requests

unit-test-job:
  stage: test
  script:
    - ./gradlew testDebugUnitTest
  only:
    - main
    - develop
    - merge_requests

build-job:
  stage: build
  script:
    - ./gradlew assembleDebug
  artifacts:
    name: "Hubly-Debug-APK-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week 
  only:
    - main
    - develop