image: ghcr.io/cirruslabs/android-sdk:34

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"

stages:
  - lint
  - test
  - deploy

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

before_script:
  - chmod +x ./gradlew
  # - cp "$GOOGLE_SERVICES_JSON" app/google-services.json

# --- TRABAJO 1: LINT DE ANDROID ---
lint-job:
  stage: lint
  script:
    - ./gradlew lintDebug
  only:
    - master
    - develop
    - merge_requests

# --- NUEVO TRABAJO: ANÁLISIS DE CALIDAD CON DETEKT ---
detekt-job:
  stage: lint # Se ejecuta en la misma fase de análisis
  script:
    - ./gradlew detekt
  # Guardamos el reporte HTML generado para poder descargarlo desde GitLab
  artifacts:
    name: "Hubly-Reporte-Calidad-Código"
    when: always # Se guarda tanto si encuentra fallos como si no
    paths:
      - app/build/reports/detekt/detekt.html
    expire_in: 1 week
  only:
    - master
    - develop
    - merge_requests

# --- TRABAJO 3: TESTS UNITARIOS ---
unit-test-job:
  stage: test
  script:
    - ./gradlew testDebugUnitTest
  only:
    - master
    - develop
    - merge_requests

# --- TRABAJO 4: DESPLIEGUE A FIREBASE ---
deploy-to-firebase-job:
  stage: deploy
  script:
    - ./gradlew assembleDebug appDistributionUploadDebug
  artifacts:
    name: "Hubly-Debug-APK-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
  only:
    - master