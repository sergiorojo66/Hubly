image: ghcr.io/cirruslabs/android-sdk:36

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"

stages:
  - lint
  - test
  - deploy

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

before_script:
  - chmod +x ./gradlew
  - cp "$GOOGLE_SERVICES_JSON" app/google-services.json

lint-job:
  stage: lint
  script:
    - ./gradlew lintDebug
  artifacts:
    name: "RankUp-Reporte-Lint"
    when: always
    paths:
      - app/build/reports/lint-results-debug.html
    expire_in: 1 week
  only:
    - master
    - develop
    - merge_requests

detekt-job:
  stage: lint 
  script:
    - ./gradlew detekt
  artifacts:
    name: "RankUp-Reporte-Calidad-Código"
    when: always 
    paths:
      - app/build/reports/detekt/detekt.html
    expire_in: 1 week
  only:
    - master
    - develop
    - merge_requests

unit-test-job:
  stage: test
  script:
    - ./gradlew testDebugUnitTest
  only:
    - master
    - develop
    - merge_requests

deploy-to-firebase-job:
  stage: deploy
  script:
    - ./gradlew assembleDebug appDistributionUploadDebug
  artifacts:
    name: "RankUp-Debug-APK-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
  only:
    - master